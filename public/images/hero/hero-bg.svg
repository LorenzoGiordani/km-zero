<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0e8d4"/>
      <stop offset="0.5" stop-color="#e8dcc4"/>
      <stop offset="1" stop-color="#d4c9b5"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="0" y1="0" x2="100" y2="100">
      <stop stop-color="#1a4d2e"/>
      <stop offset="1" stop-color="#2d7a45"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="200" y2="200">
      <stop stop-color="#c9a03a"/>
      <stop offset="1" stop-color="#e8c84a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Sun -->
  <circle cx="1000" cy="150" r="80" fill="url(#sun)" opacity="0.6"/>
  <!-- Leaves -->
  <ellipse cx="200" cy="600" rx="120" ry="40" fill="#1a4d2e" opacity="0.15" transform="rotate(-20 200 600)"/>
  <ellipse cx="300" cy="580" rx="100" ry="35" fill="#2d7a45" opacity="0.12" transform="rotate(-35 300 580)"/>
  <ellipse cx="900" cy="200" rx="100" ry="35" fill="#1a4d2e" opacity="0.1" transform="rotate(15 900 200)"/>
  <ellipse cx="100" cy="300" rx="80" ry="30" fill="#3d5a3c" opacity="0.08" transform="rotate(-10 100 300)"/>
  <!-- Ground line -->
  <path d="M0 750 Q300 720 600 740 Q900 760 1200 730" stroke="#1a4d2e" stroke-width="2" opacity="0.15" fill="none"/>
</svg>
